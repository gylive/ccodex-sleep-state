name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build four portable packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows-amd64 windows-arm64 darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            export GOOS="${target%-*}" GOARCH="${target#*-}"
            name="ccodex-sleep-state-$target"
            mkdir -p "dist/$name"
            binary=ccodex-sleep-state
            if [ "$GOOS" = windows ]; then binary="$binary.exe"; fi
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$name/$binary" ./cmd/ccodex-sleep-state
            cp LICENSE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
            cp -R docs "dist/$name/"
            if [ "$GOOS" = windows ]; then
              cp scripts/start.cmd "dist/$name/start.cmd"
            elif [ "$GOOS" = linux ]; then
              cp scripts/start.sh "dist/$name/start.sh"
              chmod +x "dist/$name/start.sh"
            else
              cp scripts/start.command "dist/$name/start.command"
              chmod +x "dist/$name/start.command"
            fi
            if [ "$GOOS" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C dist "$name"
            fi
          done
      - name: Include corresponding source and dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          git archive HEAD | tar -x -C dist/source
          (cd dist/source && go mod vendor)
          tar -czf dist/ccodex-sleep-state-source.tar.gz -C dist/source .
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* --verify-tag --prerelease \
            --title "$VERSION" \
            --notes '支持 Astra、Sol、Terra 的实验性本地服务。新增配置修复、个人/Team 规则和远程压缩兼容。请先阅读本版本测试记录：支持不等于账号具有模型权限，不保证取得指定长度的 state。Windows、macOS 和 Linux 包附中文教程与启动脚本；源码包包含锁定依赖和许可证。'
